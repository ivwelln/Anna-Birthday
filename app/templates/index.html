{% extends "base.html" %}

{% block title %}С днем рождения{% endblock %}

{% block head %}
  <link rel="stylesheet" href="{{ url_for('static', path='css/site.css') }}" />
{% endblock %}

{% block body %}
  <main
    class="birthday-app"
    id="birthdayApp"
    data-content-url="/api/content"
    data-audio-url="{{ audio_url or '' }}"
  >
    <div class="stage-glow stage-glow-one"></div>
    <div class="stage-glow stage-glow-two"></div>
    <section class="slide-stage">
      <div class="slide-card-shell">
        <div class="slide-card" id="slideCard"></div>
        <div class="continue-slot">
          <button class="continue-button hidden" id="continueButton" type="button"></button>
        </div>
      </div>
    </section>
    <button class="audio-button hidden" id="audioToggle" type="button"></button>

    <div class="empty-state hidden" id="emptyState">
      <p>Пока нет слайдов.</p>
      <span>Добавь их в <code>/admin</code>, и здесь появится поздравление.</span>
    </div>

    {% if audio_url %}
      <audio id="backgroundAudio" loop preload="auto">
        <source src="{{ audio_url }}" />
      </audio>
    {% endif %}
  </main>

  <script src="{{ url_for('static', path='js/player.js') }}" defer></script>
{% endblock %}
